<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>PediatriTrack Global</title>
    <meta name="description" content="Seguimiento pediátrico: vacunas, vitaminas, alimentación, documentos médicos y Pedi, un asistente con IA." />

    <!-- PWA: con esto se puede instalar en Android, iPhone y computadora -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00843D" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <!-- iPhone / iPad: "Agregar a pantalla de inicio" en Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PediatriTrack" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #f5faff;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>

    <!-- registro el service worker (sw.js) para que se pueda instalar y
    abra aunque la conexión esté lenta -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function (error) {
            console.log("No se pudo registrar el service worker:", error);
          });
        });
      }
    </script>
  </head>

  <body>
    <noscript>
      Necesitas activar JavaScript para usar PediatriTrack Global.
    </noscript>
    <div id="root"></div>
  </body>
</html>
